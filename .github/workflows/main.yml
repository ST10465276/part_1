name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "CI/CD Pipeline completed successfully"
          echo "Repository files:"
          find . -maxdepth 2 -type f
